stages:
  - lint
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2

# ---------- LINT ----------

lint-backend:
  stage: lint
  image: python:3.10-slim
  script:
    - pip install ruff
    - ruff check backend

lint-frontend:
  stage: lint
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run lint

# ---------- TESTS ----------

test-backend:
  stage: test
  image: python:3.10-slim
  services:
    - name: pgvector/pgvector:pg15
      alias: postgres
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: test_db
    DATABASE_URL: postgresql://test:test@postgres:5432/test_db
  script:
    - cd backend
    - pip install -r requirements.txt
    - pip install pytest coverage
    - alembic upgrade head
    - coverage run -m pytest
    - coverage report --fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'

test-frontend:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run test

lighthouse:
  stage: test
  image: node:22-slim
  before_script:
    - apt-get update && apt-get install -y chromium curl
    - npm install -g lighthouse
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run build
    - npm start &
    - sleep 15
    - curl -f http://localhost:3000 || exit 1
    - export CHROME_PATH=/usr/bin/chromium
    - lighthouse http://localhost:3000 --output=json,html --output-path=./lighthouse-report --chrome-flags="--headless --no-sandbox --disable-gpu" --preset=desktop
    - node ../scripts/check-lighthouse-score.js ./lighthouse-report.json
  artifacts:
    when: always
    paths:
      - frontend/lighthouse-report.html
      - frontend/lighthouse-report.json
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------- BUILD ----------

build-backend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" ./backend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-frontend:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
