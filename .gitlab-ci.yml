stages:
  - lint
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

cache:
  key:
    files:
      - frontend/package-lock.json
  paths:
    - .npm/
  policy: pull-push

# ---------- LINT ----------

lint-backend:
  stage: lint
  tags:
    - self-hosted-windows
  script:
    - '& "C:\Users\fenosoa\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" run --rm -v "${CI_PROJECT_DIR}:/app" -w /app python:3.10-slim sh -c "pip install ruff && ruff check backend"'

lint-frontend:
  stage: lint
  tags:
    - self-hosted-windows
  script:
    - '$env:Path = "D:\node22\node-v22.23.2-win-x64;" + $env:Path'
    - 'node --version'
    - 'cd frontend'
    - 'npm ci'
    - 'npm run lint'

# ---------- TESTS ----------

test-backend:
  stage: test
  tags:
    - self-hosted-windows
  script:
    - '$docker = "C:\Users\fenosoa\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"'
    - '$network = "backend-test-$env:CI_JOB_ID"'
    - '$postgres = "postgres-test-$env:CI_JOB_ID"'
    - '& $docker network create $network'
    - '& $docker run -d --name $postgres --network $network --network-alias postgres -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test_db pgvector/pgvector:pg15'
    - |
      for ($i = 1; $i -le 30; $i++) {
        & $docker exec $postgres pg_isready -U test -d test_db
        if ($LASTEXITCODE -eq 0) {
          Write-Host "PostgreSQL ready"
          break
        }
        if ($i -eq 30) {
          throw "PostgreSQL failed to start"
        }
        Start-Sleep -Seconds 2
      }
    - '& $docker run --rm --network $network -v "${env:CI_PROJECT_DIR}:/app" -w /app/backend -e DATABASE_URL=postgresql://test:test@postgres:5432/test_db python:3.10-slim sh -c "pip install -r requirements.txt && pip install pytest coverage && alembic upgrade head && coverage run -m pytest && coverage report --fail-under=70"'
  after_script:
    - '$docker = "C:\Users\fenosoa\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe"'
    - '$postgres = "postgres-test-$env:CI_JOB_ID"'
    - '$network = "backend-test-$env:CI_JOB_ID"'
    - '& $docker rm -f $postgres 2>$null'
    - '& $docker network rm $network 2>$null'
  coverage: '/TOTAL.*\s+(\d+%)$/'

test-frontend:
  stage: test
  tags:
    - self-hosted-windows
  script:
    - '$env:Path = "D:\node22\node-v22.23.2-win-x64;" + $env:Path'
    - 'node --version'
    - 'cd frontend'
    - 'npm ci'
    - 'npm run test'

lighthouse:
  stage: test
  tags:
    - self-hosted-windows

  script:
    # Node.js 22 portable
    - '$env:Path = "D:\node22\node-v22.23.2-win-x64;" + $env:Path'
    - 'node --version'
    - 'lighthouse --version'

    # Build production propre
    - 'cd frontend'
    - 'if (Test-Path .next) { Remove-Item -Recurse -Force .next }'
    - 'npm ci'
    - 'npm run build'

    # Démarrage de Next.js
    - '$server = Start-Process -FilePath "npm.cmd" -ArgumentList "start" -PassThru -NoNewWindow; $server.Id | Out-File -FilePath "$env:CI_PROJECT_DIR\next-server.pid" -Encoding ascii'

    # Attendre réellement que Next.js soit prêt
    - |
      $ready = $false
      for ($i = 1; $i -le 30; $i++) {
        try {
          $response = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 2
          if ($response.StatusCode -eq 200) {
            Write-Host "Next.js ready"
            $ready = $true
            break
          }
        }
        catch {
          Start-Sleep -Seconds 1
        }
      }

      if (-not $ready) {
        throw "Next.js failed to start"
      }

    - 'Start-Sleep -Seconds 5'

    # 3 audits Lighthouse
    - 'lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-run-1.json --chrome-path="C:/Program Files/Google/Chrome/Application/chrome.exe" --chrome-flags="--headless --disable-gpu --no-sandbox" --preset=desktop'
    - 'lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-run-2.json --chrome-path="C:/Program Files/Google/Chrome/Application/chrome.exe" --chrome-flags="--headless --disable-gpu --no-sandbox" --preset=desktop'
    - 'lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-run-3.json --chrome-path="C:/Program Files/Google/Chrome/Application/chrome.exe" --chrome-flags="--headless --disable-gpu --no-sandbox" --preset=desktop'

    # Sélection de la médiane
    - 'node ../scripts/select-lighthouse-median.js ./lighthouse-run-1.json ./lighthouse-run-2.json ./lighthouse-run-3.json'

    # Rapport HTML
    - 'lighthouse http://localhost:3000 --output=html --output-path=./lighthouse-report.html --chrome-path="C:/Program Files/Google/Chrome/Application/chrome.exe" --chrome-flags="--headless --disable-gpu --no-sandbox" --preset=desktop'

    # Seuil Performance >= 90
    - 'node ../scripts/check-lighthouse-score.js ./lighthouse-report.json'

  after_script:
  - |
    $pidFile = "$env:CI_PROJECT_DIR\next-server.pid"
    if (Test-Path $pidFile) {
      $serverPid = Get-Content $pidFile
      Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue
      Remove-Item $pidFile -Force -ErrorAction SilentlyContinue
    }

  artifacts:
    when: always
    paths:
      - frontend/lighthouse-run-1.json
      - frontend/lighthouse-run-2.json
      - frontend/lighthouse-run-3.json
      - frontend/lighthouse-report.html
      - frontend/lighthouse-report.json
    expire_in: 1 week

  rules:
    - if: $CI_COMMIT_BRANCH == "test/self-hosted-runner"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------- BUILD ----------

build-backend:
  stage: build
  image: docker:29
  tags:
    - self-hosted
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" ./backend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "test/self-hosted-runner"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-frontend:
  stage: build
  image: docker:24
  tags:
    - self-hosted
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "test/self-hosted-runner"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"