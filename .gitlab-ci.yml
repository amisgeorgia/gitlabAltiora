stages:
  - lint
  - test
  - build

variables:
  DOCKER_DRIVER: overlay2
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"

cache:
  key:
    files:
      - frontend/package-lock.json
  paths:
    - .npm/
  policy: pull-push

# ---------- LINT ----------

lint-backend:
  stage: lint
  image: python:3.10-slim
  tags:
    - self-hosted
  script:
    - pip install ruff
    - ruff check backend

lint-frontend:
  stage: lint
  image: node:22-alpine
  tags:
    - self-hosted
  script:
    - cd frontend
    - npm ci
    - npm run lint

# ---------- TESTS ----------

test-backend:
  stage: test
  image: python:3.10-slim
  tags:
    - self-hosted
  services:
    - name: pgvector/pgvector:pg15
      alias: postgres
  variables:
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    POSTGRES_DB: test_db
    DATABASE_URL: postgresql://test:test@postgres:5432/test_db
  script:
    - cd backend
    - pip install -r requirements.txt
    - pip install pytest coverage
    - alembic upgrade head
    - coverage run -m pytest
    - coverage report --fail-under=70
  coverage: '/TOTAL.*\s+(\d+%)$/'

test-frontend:
  stage: test
  image: node:22-alpine
  tags:
    - self-hosted
  script:
    - cd frontend
    - npm ci
    - npm run test

lighthouse:
  stage: test
  image:
    name: altiora-lighthouse:13.4.1
    entrypoint: [""]
    pull_policy: if-not-present
  tags:
    - self-hosted
  script:
    - cd frontend
    - npm ci
    - npm run build
    - npm start &
    - |
      for i in $(seq 1 30); do
        if curl -fsS -o /dev/null http://localhost:3000; then
          echo "Next.js ready"
          break
        fi
        if [ "$i" -eq 30 ]; then
          echo "Next.js failed to start"
          exit 1
        fi
        sleep 1
      done
    - sleep 5
    - export CHROME_PATH=/usr/bin/chromium
    - lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-run-1.json --chrome-flags="--headless --no-sandbox --disable-gpu" --preset=desktop
    - lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-run-2.json --chrome-flags="--headless --no-sandbox --disable-gpu" --preset=desktop
    - lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-run-3.json --chrome-flags="--headless --no-sandbox --disable-gpu" --preset=desktop
    - node ../scripts/select-lighthouse-median.js ./lighthouse-run-1.json ./lighthouse-run-2.json ./lighthouse-run-3.json
    - lighthouse http://localhost:3000 --output=html --output-path=./lighthouse-report.html --chrome-flags="--headless --no-sandbox --disable-gpu" --preset=desktop
    - node ../scripts/check-lighthouse-score.js ./lighthouse-report.json
  artifacts:
    when: always
    paths:
      - frontend/lighthouse-run-1.json
      - frontend/lighthouse-run-2.json
      - frontend/lighthouse-run-3.json
      - frontend/lighthouse-report.html
      - frontend/lighthouse-report.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "test/self-hosted-runner"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ---------- BUILD ----------

build-backend:
  stage: build
  image: docker:29
  tags:
    - self-hosted
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA" ./backend
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "test/self-hosted-runner"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-frontend:
  stage: build
  image: docker:24
  tags:
    - self-hosted
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "test/self-hosted-runner"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------- test minimal du runner Windows ----------

windows-runner-check:
  stage: lint
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[windows-check\]/'
  tags:
    - self-hosted-windows
  script:
    - Write-Host "=== USER ==="
    - whoami
    - Write-Host "=== DOCKER VERSION ==="
    - '& "C:\Users\fenosoa\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" version'
    - Write-Host "=== DOCKER OS ==="
    - '& "C:\Users\fenosoa\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" info --format "{{.OSType}}"'
    - Write-Host "=== LINUX CONTAINER ==="
    - '& "C:\Users\fenosoa\AppData\Local\Programs\DockerDesktop\resources\bin\docker.exe" run --rm node:22-alpine node --version'